<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MediVault Test Prescription Signer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 20px; }
    textarea { width: 100%; height: 130px; overflow-wrap: anywhere; }
    button { padding: 10px 16px; margin: 8px 8px 8px 0; cursor: pointer; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>MediVault — Synthetic Prescription Signer</h2>
  <p>This page signs only the hash of our dummy prescription. It never asks for a private key.</p>
  <p><b>Expected doctor wallet:</b><br>
  <code>0x66C930eBE0ABF4524b43f506530113e3b70f09a1</code></p>
  <p><b>Prescription SHA-256:</b><br>
  <code id="hash"></code></p>
  <button id="sign">Connect wallet and sign hash</button>
  <p id="status">Ready. Select the test-doctor account in MetaMask before signing.</p>
  <label for="signature"><b>Generated signature:</b></label>
  <textarea id="signature" readonly placeholder="Your signature will appear here"></textarea><br>
  <button id="copy" disabled>Copy signature</button>
  <script>
    const expectedDoctor = "0x66C930eBE0ABF4524b43f506530113e3b70f09a1";
    const hash = "0xf4da80f4463352ea1088f9b19263d50ba3714bb6301df7836678f3c6d8bd6c8b";
    document.getElementById("hash").textContent = hash;
    const status = document.getElementById("status");
    const signatureField = document.getElementById("signature");
    const signButton = document.getElementById("sign");
    const copyButton = document.getElementById("copy");
    signButton.addEventListener("click", async () => {
      signButton.disabled = true;
      try {
        if (!window.ethereum) {
          throw new Error("MetaMask was not detected. Enable the extension and reload.");
        }
        const accounts = await window.ethereum.request({
          method: "eth_requestAccounts"
        });
        const account = accounts[0];
        if (!account || account.toLowerCase() !== expectedDoctor.toLowerCase()) {
          throw new Error("Wrong account selected. Switch MetaMask to the test-doctor wallet and reload this page.");
        }
        status.textContent = "Check the MetaMask request. It should be a message signature, not a transaction.";
        const signature = await window.ethereum.request({
          method: "personal_sign",
          params: [hash, account]
        });
        signatureField.value = signature;
        copyButton.disabled = false;
        status.textContent = "Signature generated successfully. Copy it into MediVault's Wallet signature field.";
      } catch (error) {
        status.textContent = error.message || String(error);
      } finally {
        signButton.disabled = false;
      }
    });
    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(signatureField.value);
        status.textContent = "Signature copied. Return to the prescription page and paste it into Wallet signature.";
      } catch {
        signatureField.focus();
        signatureField.select();
        status.textContent = "Select the signature above and copy it manually.";
      }
    });
  </script>
</body>
</html>
